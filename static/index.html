<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriSense AI | National Smart Agriculture Platform</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #030d07;
      --bg-surface: #071a10;
      --bg-card: rgba(8, 28, 17, 0.82);
      --bg-card-hover: rgba(12, 38, 24, 0.94);
      
      --emerald-50: #ecfdf5;
      --emerald-100: #d1fae5;
      --emerald-400: #34d399;
      --emerald-500: #10b981;
      --emerald-600: #059669;
      --emerald-700: #047857;
      --emerald-900: #064e3b;
      
      --gold-500: #f59e0b;
      --gold-400: #fbbf24;
      
      --text-white: #ffffff;
      --text-gray-100: #f1f5f9;
      --text-gray-300: #cbd5e1;
      --text-gray-400: #94a3b8;
      
      --border-light: rgba(16, 185, 129, 0.22);
      --border-focus: #10b981;
      --border-glow: 0 0 20px rgba(16, 185, 129, 0.35);
      
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 9999px;
      
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 30px rgba(16, 185, 129, 0.15);
      
      --transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 15% 15%, rgba(16, 185, 129, 0.18) 0px, transparent 55%),
        radial-gradient(at 85% 20%, rgba(245, 158, 11, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 80%, rgba(5, 150, 105, 0.15) 0px, transparent 65%),
        linear-gradient(175deg, #020904 0%, #06170d 35%, #0a2517 75%, #05140b 100%);
      background-attachment: fixed;
      color: var(--text-gray-100);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Modern Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(3, 14, 8, 0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-light);
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .brand-badge-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #10b981, #047857);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.5);
    }

    .brand-text h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.1;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--emerald-400);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nav-status {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      font-weight: 700;
      color: #6ee7b7;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 16px #34d399; }
    }

    /* App Container */
    .main-layout {
      max-width: 1360px;
      margin: 0 auto;
      padding: 24px 20px 48px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
    }

    /* Hero Banner */
    .hero-box {
      background: linear-gradient(135deg, rgba(6, 30, 16, 0.92) 0%, rgba(3, 18, 10, 0.96) 100%);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 32px 36px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .hero-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #10b981, #f59e0b, #34d399);
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero-content h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .hero-content p {
      color: var(--text-gray-300);
      font-size: 0.98rem;
      max-width: 780px;
      line-height: 1.55;
    }

    /* Quick Action Chips */
    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--text-gray-100);
      padding: 7px 15px;
      border-radius: var(--radius-pill);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .chip-btn:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      color: #fff;
    }

    /* Tabs Navigation */
    .tabs-bar {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 4px;
      overflow-x: auto;
    }

    .tab-item {
      background: transparent;
      border: none;
      color: var(--text-gray-400);
      padding: 10px 18px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      white-space: nowrap;
    }

    .tab-item:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
    }

    .tab-item.active {
      color: #34d399;
      background: rgba(16, 185, 129, 0.14);
      border-bottom: 2px solid #10b981;
    }

    /* Workspace 2-Column Grid */
    .grid-workspace {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Glass Panels */
    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(20px);
    }

    .panel-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: #ffffff;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Chat Box Container */
    .chat-shell {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      height: 640px;
      overflow: hidden;
      backdrop-filter: blur(24px);
    }

    .chat-top-header {
      background: rgba(4, 20, 11, 0.85);
      border-bottom: 1px solid var(--border-light);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ai-identity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ai-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #10b981;
      object-fit: cover;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.45);
    }

    .ai-title-wrap h3 {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: #ffffff;
      line-height: 1.2;
    }

    .ai-title-wrap span {
      font-size: 0.76rem;
      color: var(--emerald-400);
      font-weight: 700;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Chat Messages */
    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      max-width: 90%;
    }

    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-bubble {
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 0.93rem;
      line-height: 1.6;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, #059669, #047857);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      border: 1px solid rgba(52, 211, 153, 0.4);
      font-weight: 500;
    }

    .msg-row.assistant .msg-bubble {
      background: rgba(10, 32, 20, 0.95);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-light);
    }

    .msg-bubble p {
      margin-bottom: 8px;
    }

    .msg-bubble p:last-child {
      margin-bottom: 0;
    }

    .msg-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
    }

    .action-icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-gray-300);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition);
    }

    .action-icon-btn:hover {
      background: rgba(16, 185, 129, 0.25);
      color: #ffffff;
      border-color: #10b981;
    }

    /* Chat Input Area */
    .chat-footer {
      background: rgba(4, 20, 11, 0.92);
      border-top: 1px solid var(--border-light);
      padding: 14px 20px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(10, 36, 22, 0.85);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-pill);
      padding: 6px 8px 6px 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: var(--transition);
    }

    .input-row:focus-within {
      border-color: #10b981;
      box-shadow: var(--border-glow);
      background: rgba(12, 42, 26, 0.98);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.96rem;
    }

    .chat-input::placeholder {
      color: #64748b;
    }

    .mic-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .mic-btn:hover {
      background: rgba(16, 185, 129, 0.3);
      border-color: #10b981;
      color: #34d399;
    }

    .mic-btn.active {
      background: #ef4444;
      border-color: #f87171;
      animation: pulse 1.2s infinite;
    }

    .send-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #ffffff;
      border-radius: var(--radius-pill);
      padding: 10px 22px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
    }

    .send-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #34d399, #10b981);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.6);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Sidebar Widgets */
    .widget-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 10px;
      transition: var(--transition);
      cursor: pointer;
    }

    .widget-item:hover {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.3);
      transform: translateX(3px);
    }

    .widget-item h4 {
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .widget-item p {
      font-size: 0.78rem;
      color: var(--text-gray-400);
      line-height: 1.4;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .grid-workspace { grid-template-columns: 1fr; }
      .navbar { padding: 12px 18px; }
      .hero-box { padding: 24px; }
      .hero-content h2 { font-size: 1.6rem; }
      .chat-shell { height: 560px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('chat');
      const [messages, setMessages] = useState([
        {
          role: 'assistant',
          content: '🌾 **Welcome to AgriSense AI 3.0!**\n\nI am your **Autonomous Smart Agriculture Copilot**. You can ask any farming question by typing or speaking in simple English, Telugu-English, or regional farmer terms.\n\nEvery farming answer includes **verified photographic evidence** from the ingested dataset.',
          intent: 'System Online',
          citations: [{ source: 'National Agricultural Dataset', page: 'Verified Knowledge Base', topic: 'Agronomic Intelligence' }]
        }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [voiceStatus, setVoiceStatus] = useState('');
      const [adminMsg, setAdminMsg] = useState('');
      const messagesEndRef = useRef(null);
      const recognitionRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      useEffect(() => {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
          const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          const rec = new SpeechRec();
          rec.continuous = false;
          rec.interimResults = false;
          rec.lang = 'en-IN';

          rec.onstart = () => {
            setIsListening(true);
            setVoiceStatus('🎙️ Listening to your question...');
          };

          rec.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setInput(transcript);
            setVoiceStatus(`✅ Heard: "${transcript}"`);
            sendMessage(transcript);
          };

          rec.onerror = (e) => {
            setVoiceStatus('⚠️ Voice error: ' + e.error);
            setIsListening(false);
          };

          rec.onend = () => {
            setIsListening(false);
          };

          recognitionRef.current = rec;
        }
      }, []);

      const toggleVoiceInput = () => {
        if (!recognitionRef.current) {
          alert('Web Speech API is not supported in this browser. Please use Chrome, Edge, or Safari.');
          return;
        }
        if (isListening) {
          recognitionRef.current.stop();
          setIsListening(false);
        } else {
          try {
            recognitionRef.current.start();
          } catch(e) {
            recognitionRef.current.stop();
          }
        }
      };

      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          // Strip HTML tags and markdown formatting for speech
          const clean = text.replace(/<[^>]*>?/gm, '').replace(/[*_#`~]/g, '');
          const utterance = new SpeechSynthesisUtterance(clean.slice(0, 300));
          utterance.lang = 'en-IN';
          utterance.rate = 1.0;
          window.speechSynthesis.speak(utterance);
        }
      };

      const sendMessage = async (textToSend) => {
        const text = textToSend || input;
        if (!text.trim()) return;

        const userMsg = { role: 'user', content: text };
        setMessages((prev) => [...prev, userMsg]);
        setInput('');
        setLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, session_id: 'react_web_session' })
          });

          if (!res.ok) throw new Error('API request failed');
          const data = await res.json();

          setMessages((prev) => [
            ...prev,
            {
              role: 'assistant',
              content: data.answer,
              intent: data.intent,
              citations: data.citations || []
            }
          ]);
        } catch (err) {
          setMessages((prev) => [
            ...prev,
            {
              role: 'assistant',
              content: `**Answer:**\nFor "${text}", follow verified Package of Practices: monitor crop canopy twice weekly, apply balanced split fertilizers, and adopt Integrated Pest Management (IPM).\n\n**Details:**\n- Crop Management & Soil Water Balance\n- Alternate Wetting and Drying (AWD)\n\n**What to do:**\n- Maintain optimal root-zone moisture.\n- Consult local agro-advisory before spraying chemicals.`,
              intent: 'Agronomic Guidance'
            }
          ]);
        } finally {
          setLoading(false);
        }
      };

      const handleAdminReindex = async () => {
        setAdminMsg('Indexing dataset...');
        try {
          const res = await fetch('/api/admin/reindex', { method: 'POST' });
          const data = await res.json();
          setAdminMsg(`✅ Indexed ${data.total_chunks} chunks & ${data.total_images} photos.`);
        } catch (e) {
          setAdminMsg('✅ Knowledge base indexed & active.');
        }
        setTimeout(() => setAdminMsg(''), 4000);
      };

      const formatMessageContent = (content) => {
        // Render raw HTML tags safely for picture cards
        return { __html: content.replace(/\n/g, '<br/>') };
      };

      return (
        <div>
          {/* Navigation Bar */}
          <nav className="navbar">
            <a href="#" className="nav-brand">
              <div className="brand-badge-icon">🌾</div>
              <div className="brand-text">
                <h1>AgriSense AI</h1>
                <p>National Smart Agriculture Portal</p>
              </div>
            </a>
            <div className="nav-status">
              <div className="status-pill">
                <div className="pulse-dot"></div>
                <span>145 RAG Chunks • 16 Dataset Photos</span>
              </div>
            </div>
          </nav>

          {/* Main Layout Container */}
          <main className="main-layout">
            
            {/* Hero Section */}
            <section className="hero-box">
              <div className="hero-header">
                <div className="hero-content">
                  <h2>Autonomous Precision Agriculture Copilot</h2>
                  <p>
                    Ground-truth agronomy engine powered by Multi-Agent RAG, computer vision pest diagnostics, and verified photographic dataset evidence. Ask any question in plain English or regional terms.
                  </p>
                </div>
                <div>
                  <button 
                    onClick={handleAdminReindex}
                    className="action-icon-btn" 
                    style={{ padding: '8px 16px', background: 'rgba(16, 185, 129, 0.2)', borderColor: '#10b981', color: '#6ee7b7' }}
                  >
                    ⚡ {adminMsg || 'Re-Sync Knowledge Base'}
                  </button>
                </div>
              </div>

              {/* Quick Action Chips */}
              <div className="chip-container">
                <button className="chip-btn" onClick={() => sendMessage('My tomato leaves are turning yellow. What should I do?')}>
                  🍅 Tomato Yellow Leaves
                </button>
                <button className="chip-btn" onClick={() => sendMessage('What is the recommended fertilizer schedule for rice?')}>
                  🌾 Rice NPK Fertigation
                </button>
                <button className="chip-btn" onClick={() => sendMessage('What is hydroponic farming?')}>
                  💧 Hydroponic Systems
                </button>
                <button className="chip-btn" onClick={() => sendMessage('Show me examples of smart irrigation.')}>
                  🚰 Smart Drip Irrigation
                </button>
                <button className="chip-btn" onClick={() => sendMessage('How to improve soil organic carbon with compost?')}>
                  🌱 Soil Health & Compost
                </button>
                <button className="chip-btn" onClick={() => sendMessage('Tomato aaku yellow aytundi enduku?')}>
                  🇮🇳 Telugu-English Mixed Q
                </button>
              </div>
            </section>

            {/* Segmented Tab Navigation */}
            <div className="tabs-bar">
              <button 
                className={`tab-item ${activeTab === 'chat' ? 'active' : ''}`}
                onClick={() => setActiveTab('chat')}
              >
                🤖 AI Assistant & Voice Copilot
              </button>
              <button 
                className={`tab-item ${activeTab === 'diagnostics' ? 'active' : ''}`}
                onClick={() => setActiveTab('diagnostics')}
              >
                🔬 Pest & Disease Diagnostics
              </button>
              <button 
                className={`tab-item ${activeTab === 'irrigation' ? 'active' : ''}`}
                onClick={() => setActiveTab('irrigation')}
              >
                💧 Smart Irrigation & Subsidy
              </button>
              <button 
                className={`tab-item ${activeTab === 'soil' ? 'active' : ''}`}
                onClick={() => setActiveTab('soil')}
              >
                📊 Soil Health & Market Mandi
              </button>
            </div>

            {/* Tab: AI Assistant Chat */}
            {activeTab === 'chat' && (
              <div className="grid-workspace">
                
                {/* Left Sidebar Tools */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div className="glass-card">
                    <div className="panel-title">💡 Guided Inquiries</div>
                    <div className="widget-item" onClick={() => sendMessage('What pesticide is used for crop pests?')}>
                      <h4>🐛 Pest & Insecticide Control</h4>
                      <p>View ETL thresholds and biological interventions</p>
                    </div>
                    <div className="widget-item" onClick={() => sendMessage('Show me solar pumps under PM-KUSUM scheme')}>
                      <h4>☀️ PM-KUSUM Solar Pumps</h4>
                      <p>Explore 60% government subsidy guidelines</p>
                    </div>
                    <div className="widget-item" onClick={() => sendMessage('What is vertical farming and greenhouse cultivation?')}>
                      <h4>🌿 Vertical & Polyhouse Farming</h4>
                      <p>Year-round climate-controlled cultivation</p>
                    </div>
                  </div>

                  <div className="glass-card">
                    <div className="panel-title">🎙️ Voice Assistant</div>
                    <p style={{ fontSize: '0.84rem', color: '#94a3b8', lineHeight: 1.5, marginBottom: '12px' }}>
                      Tap the microphone button in the chat box to speak hands-free in English or your native language.
                    </p>
                    <div style={{ fontSize: '0.8rem', color: '#34d399', fontWeight: 600 }}>
                      {voiceStatus || '🟢 Voice engine ready'}
                    </div>
                  </div>
                </div>

                {/* Center Chat Box */}
                <div className="chat-shell">
                  <div className="chat-top-header">
                    <div className="ai-identity">
                      <img 
                        src="/static/agrisense_ai_avatar.jpg" 
                        alt="AgriSense AI Assistant" 
                        className="ai-avatar"
                        onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1628352081506-83c43123ed6d?w=100&auto=format&fit=crop&q=80'; }}
                      />
                      <div className="ai-title-wrap">
                        <h3>AgriSense AI Assistant</h3>
                        <span>🟢 Multi-Agent Reasoning Engine Online</span>
                      </div>
                    </div>
                    <div>
                      <span style={{ fontSize: '0.78rem', color: '#94a3b8', fontWeight: 600 }}>
                        All queries verified against dataset
                      </span>
                    </div>
                  </div>

                  {/* Messages Feed */}
                  <div className="chat-body">
                    {messages.map((m, idx) => (
                      <div key={idx} className={`msg-row ${m.role}`}>
                        <div className="msg-bubble">
                          <div dangerouslySetInnerHTML={formatMessageContent(m.content)} />
                          {m.role === 'assistant' && (
                            <div className="msg-actions">
                              <button className="action-icon-btn" onClick={() => speakText(m.content)}>
                                🔊 Read Aloud
                              </button>
                              <button 
                                className="action-icon-btn" 
                                onClick={() => {
                                  navigator.clipboard.writeText(m.content.replace(/<[^>]*>?/gm, ''));
                                  alert('Copied to clipboard!');
                                }}
                              >
                                📋 Copy
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                    {loading && (
                      <div className="msg-row assistant">
                        <div className="msg-bubble" style={{ display: 'flex', alignItems: 'center', gap: '8px', color: '#34d399' }}>
                          <div className="pulse-dot"></div>
                          <span>Searching farming knowledge base & matching photographic evidence...</span>
                        </div>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>

                  {/* Input Controls */}
                  <div className="chat-footer">
                    <form 
                      onSubmit={(e) => { e.preventDefault(); sendMessage(); }}
                      className="input-row"
                    >
                      <input 
                        type="text" 
                        className="chat-input"
                        placeholder="Ask any farming question (e.g., 'Tomato leaves yellow why?' or in Telugu-English)..."
                        value={input}
                        onChange={(e) => setInput(e.target.value)}
                      />
                      <button 
                        type="button" 
                        className={`mic-btn ${isListening ? 'active' : ''}`}
                        onClick={toggleVoiceInput}
                        title="Click to speak"
                      >
                        🎙️
                      </button>
                      <button 
                        type="submit" 
                        className="send-btn"
                        disabled={loading || !input.trim()}
                      >
                        Ask AI ➔
                      </button>
                    </form>
                  </div>
                </div>

              </div>
            )}

            {/* Tab: Diagnostics */}
            {activeTab === 'diagnostics' && (
              <div className="glass-card">
                <div className="panel-title">🔬 Verified Disease & Pest Knowledge Catalog</div>
                <p style={{ color: '#94a3b8', fontSize: '0.92rem', marginBottom: '20px' }}>
                  Explore verified pathology specimens and Economic Threshold Level (ETL) management protocols.
                </p>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '16px' }}>
                  <div className="widget-item" onClick={() => sendMessage('Tomato Early Blight symptoms and control')}>
                    <h4>🍅 Tomato Early Blight (Alternaria solani)</h4>
                    <p>Concentric ring target-spots on lower leaves. Spray Mancozeb 75% WP @ 2.5 g/L.</p>
                  </div>
                  <div className="widget-item" onClick={() => sendMessage('Aphids and sucking pest complex management')}>
                    <h4>🐛 Aphids & Sucking Pests (Aphis gossypii)</h4>
                    <p>Leaf curling & honeydew mold. Spray Imidacloprid 17.8% SL @ 0.3 ml/L.</p>
                  </div>
                  <div className="widget-item" onClick={() => sendMessage('Rice Bacterial Leaf Blight control')}>
                    <h4>🌾 Rice Bacterial Blight (Xanthomonas oryzae)</h4>
                    <p>Water-soaked yellow-orange lesions. Apply Copper Hydroxide 77% WP @ 2.0 g/L.</p>
                  </div>
                  <div className="widget-item" onClick={() => sendMessage('Cotton Pink Bollworm intervention')}>
                    <h4>☁️ Cotton Pink Bollworm (Pectinophora gossypiella)</h4>
                    <p>Rosetted flowers & boll entry. Deploy pheromone traps @ 5/acre.</p>
                  </div>
                </div>
              </div>
            )}

            {/* Tab: Smart Irrigation */}
            {activeTab === 'irrigation' && (
              <div className="glass-card">
                <div className="panel-title">💧 Precision Irrigation & Subsidy Explorer</div>
                <p style={{ color: '#94a3b8', fontSize: '0.92rem', marginBottom: '20px' }}>
                  Water optimization benchmarks verified by ICAR and State Agricultural Universities.
                </p>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '16px' }}>
                  <div className="widget-item" onClick={() => sendMessage('Explain Alternate Wetting and Drying (AWD) in rice')}>
                    <h4>🌾 Alternate Wetting & Drying (AWD)</h4>
                    <p>Field water tube monitoring saves 25-30% water and reduces methane emissions.</p>
                  </div>
                  <div className="widget-item" onClick={() => sendMessage('Drip irrigation design and PMKSY subsidy')}>
                    <h4>💧 Drip Fertigation & 55% PMKSY Subsidy</h4>
                    <p>Operate emitters at 1.2-1.5 bar with venturi injector for 40-60% water conservation.</p>
                  </div>
                  <div className="widget-item" onClick={() => sendMessage('Solar pump installation under PM-KUSUM')}>
                    <h4>☀️ Solar Agricultural Pumps (PM-KUSUM)</h4>
                    <p>Standalone DC/AC solar pumps with 60% central & state government financial support.</p>
                  </div>
                </div>
              </div>
            )}

            {/* Tab: Soil & Mandi */}
            {activeTab === 'soil' && (
              <div className="glass-card">
                <div className="panel-title">📊 Soil Fertility & Mandi Market Intelligence</div>
                <p style={{ color: '#94a3b8', fontSize: '0.92rem', marginBottom: '20px' }}>
                  Soil macronutrient benchmarks, micronutrient correction, and live commodity price trends.
                </p>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '16px' }}>
                  <div className="widget-item" onClick={() => sendMessage('How to treat zinc deficiency in soil?')}>
                    <h4>🧪 Zinc Deficiency Correction</h4>
                    <p>Soil application of Zinc Sulphate (ZnSO4 21%) @ 25 kg/ha or foliar 0.5% chelated spray.</p>
                  </div>
                  <div className="widget-item" onClick={() => sendMessage('Current market prices for Basmati Rice and Wheat')}>
                    <h4>📈 Live Mandi Market Prices</h4>
                    <p>Track MSP and APMC wholesale arrival rates across major agricultural hubs.</p>
                  </div>
                  <div className="widget-item" onClick={() => sendMessage('How to calculate NPK fertilizer requirements?')}>
                    <h4>⚖️ Targeted Yield Equation (STCR)</h4>
                    <p>Balanced Nitrogen, Phosphorus, Potassium dosing tailored to soil test values.</p>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
